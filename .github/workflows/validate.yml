name: Validate static site

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files and internal links
        run: |
          python3 scripts/validate_site.py
      - name: Report legal-page placeholders
        run: |
          markers=$(grep -RIl 'LEGAL_TODO' impressum datenschutz en/imprint en/privacy || true)
          if [ -n "$markers" ]; then
            echo "::warning::Published legal pages still contain placeholders; review them before publication."
          fi
