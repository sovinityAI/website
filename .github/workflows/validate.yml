name: Validate static site

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files and internal links
        run: |
          python3 scripts/validate_site.py
      - name: Report publication blockers
        run: |
          count=$(grep -RIl --exclude-dir=.git 'LEGAL_TODO' . | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "::notice::$count file(s) still contain LEGAL_TODO markers; GitHub Pages must remain disabled."
          fi
