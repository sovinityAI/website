name: Validate static site

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files and internal links
        run: |
          python3 scripts/validate_site.py
      - name: Report legal-page placeholders
        run: |
          markers=$(grep -RIl 'LEGAL_TODO' impressum datenschutz en/imprint en/privacy || true)
          if [ -n "$markers" ]; then
            echo "::warning::Published legal pages still contain placeholders; review them before publication."
          fi

  browser-quality:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check responsive behavior, accessibility and visual baselines
        run: npm run test:browser
      - name: Upload browser report after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
